name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "zonefile-test"
          cache-on-failure: false

      - name: Run tests
        run: cargo test --workspace --all-features

  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "zonefile-build"
          cache-on-failure: false

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Strip binaries
        run: |
          strip target/release/domain-api
          strip target/release/domain-indexer

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ github.sha }}
          path: |
            target/release/domain-api
            target/release/domain-indexer
          retention-days: 7

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries-${{ github.sha }}
          path: ./binaries

      - name: Make binaries executable
        run: chmod +x ./binaries/*

      - name: Create backup on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            mkdir -p ${{ secrets.DEPLOYMENT_PATH }}/backups
            if [ -f ${{ secrets.DEPLOYMENT_PATH }}/target/release/domain-api ]; then
              cp ${{ secrets.DEPLOYMENT_PATH }}/target/release/domain-api \
                 ${{ secrets.DEPLOYMENT_PATH }}/backups/domain-api.$TIMESTAMP
              cp ${{ secrets.DEPLOYMENT_PATH }}/target/release/domain-indexer \
                 ${{ secrets.DEPLOYMENT_PATH }}/backups/domain-indexer.$TIMESTAMP
              echo $TIMESTAMP > ${{ secrets.DEPLOYMENT_PATH }}/backups/latest
              cd ${{ secrets.DEPLOYMENT_PATH }}/backups
              ls -t domain-api.* 2>/dev/null | tail -n +6 | xargs -r rm
              ls -t domain-indexer.* 2>/dev/null | tail -n +6 | xargs -r rm
            fi

      - name: Deploy binaries to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "binaries/domain-api,binaries/domain-indexer"
          target: "${{ secrets.DEPLOYMENT_PATH }}/target/release/"
          strip_components: 1

      - name: Restart PM2 and verify deployment
        id: restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.DEPLOYMENT_PATH }}
            chmod +x target/release/domain-api target/release/domain-indexer
            pm2 restart zonefile-api --update-env

            # Health check with retry
            MAX_ATTEMPTS=10
            ATTEMPT=1
            WAIT_TIME=2

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."
              HEALTH_STATUS=$(curl -sf http://localhost:3003/health || echo "failed")

              if echo "$HEALTH_STATUS" | grep -q '"status":"ok"'; then
                DOC_COUNT=$(echo "$HEALTH_STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('index_documents',0))" 2>/dev/null || echo "0")
                echo "✓ Deployment successful! Index documents: $DOC_COUNT"
                exit 0
              fi

              echo "Health check failed, waiting ${WAIT_TIME}s..."
              sleep $WAIT_TIME
              WAIT_TIME=$((WAIT_TIME * 2))
              ATTEMPT=$((ATTEMPT + 1))
            done

            echo "✗ Health checks failed after $MAX_ATTEMPTS attempts"
            exit 1

      - name: Rollback on failure
        if: failure() && steps.restart.conclusion != 'skipped'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔄 Initiating rollback..."
            LAST_BACKUP=$(cat ${{ secrets.DEPLOYMENT_PATH }}/backups/latest 2>/dev/null || echo "none")

            if [ "$LAST_BACKUP" != "none" ]; then
              cp ${{ secrets.DEPLOYMENT_PATH }}/backups/domain-api.$LAST_BACKUP \
                 ${{ secrets.DEPLOYMENT_PATH }}/target/release/domain-api
              cp ${{ secrets.DEPLOYMENT_PATH }}/backups/domain-indexer.$LAST_BACKUP \
                 ${{ secrets.DEPLOYMENT_PATH }}/target/release/domain-indexer
              pm2 restart zonefile-api
              sleep 5
              curl -sf http://localhost:3003/health | grep -q '"status":"ok"' && \
                echo "✓ Rollback successful" || echo "✗ Rollback failed! Manual intervention required."
            else
              echo "⚠ No backup available for rollback"
            fi
